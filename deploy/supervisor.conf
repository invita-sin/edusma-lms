[program:edusma-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/edusma/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/edusma/storage/logs/supervisor-queue.log
stdout_logfile_maxbytes=10MB

[program:edusma-reverb]
process_name=%(program_name)s_%(process_num)01d
command=php /var/www/edusma/artisan reverb:start
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/edusma/storage/logs/supervisor-reverb.log
stdout_logfile_maxbytes=10MB
